# Factory C: trading strategy factory. Read by the run wrapper and by every skill.
# Only the operator edits this file (deny rule). A wish to change it is escalation GEN-1.
# All USD. Paper only: no live limits exist because no live trading exists.
#
# Hard limits: monthly_caps_usd, per_run, run_timeout_minutes, escalation.
# Pass rules for strategies are not here. They are in engine/gate.yaml, and the bar rises
# with the number of trials on its own. "Reference points" are guidance, not gates.

factory: c-trading

monthly_caps_usd:
  tokens: 150            # Claude usage at API-rate accounting, from total_cost_usd per run
  paid_api: 0            # no paid data or platform. Raising it is F-ACC-2
  total: 150

model: sonnet            # default for every stage. A stage may name its own under per_run
run_timeout_minutes: 60

per_run:                 # passed by the wrapper as --max-turns and --max-budget-usd
  ideate:        {max_turns: 40,  max_budget_usd: 3.00}
  build:         {max_turns: 60,  max_budget_usd: 5.00, model: opus}
  optimise:      {max_turns: 60,  max_budget_usd: 5.00, model: opus}
  weekly-review: {max_turns: 40,  max_budget_usd: 4.00, model: opus}
  maintain:      {max_turns: 40,  max_budget_usd: 4.00, model: opus}
  winner-packet: {max_turns: 40,  max_budget_usd: 4.00, model: opus}

pipeline:
  max_new_cards_per_run: 3
  max_items_awaiting_build: 6        # ideate does nothing above this
  max_trials_per_run: 120            # spend guard on one optimise run, not a target

escalation:
  default_packet_expiry_days: 7
  winner_packet_expiry_days: 14
  consecutive_failures_before_stop: 3

# Reference points: guidance for judgement. The run states what it relied on.

research:
  typical_sweep_trials: 40           # enough to see whether a region is stable
  typical_parameters: 3
