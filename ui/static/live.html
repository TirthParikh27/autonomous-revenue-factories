<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factories · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed tilted HUD scene; top bar (title · Board|Live · KPIs); right rail "Needs you"; detail panel slides over the rail. */
:root{
  color-scheme:dark;
  --bg:#050b14; --glass:rgba(10,20,34,.86); --line:rgba(120,190,230,.18); --line2:rgba(120,190,230,.34);
  --ink:#d9e8f4; --ink2:#7f97ad; --ink3:#4d6278;
  --cyan:#5fd4f4; --amber:#ffb23e; --red:#ff5d6c; --green:#6fe0b0;
  --hud:"Chakra Petch","Segoe UI",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --rail:324px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;background:radial-gradient(ellipse at 40% 55%,#0b1a2c 0%,var(--bg) 62%)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.lb>*{position:absolute;pointer-events:auto;white-space:nowrap;width:max-content}
.c-below>*{transform:translate(-50%,var(--off,16px))}
.c-above>*{transform:translate(-50%,calc(-100% - var(--off,16px)))}
.c-right>*{transform:translate(var(--off,20px),-50%)}
.c-left>*{transform:translate(calc(-100% - var(--off,20px)),-50%)}
.lv-all,.lv-fac{transition:opacity .2s}
/* top bar */
header{position:fixed;inset:0 0 auto 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(5,11,20,.94),rgba(5,11,20,0));z-index:5;pointer-events:none}
header>*{pointer-events:auto}
.brand{font:600 15px var(--hud);letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.asof{font:11px var(--mono);color:var(--ink2);margin-top:2px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;padding:3px;background:rgba(8,16,28,.8);font:500 13px var(--hud);letter-spacing:.08em}
.seg a,.seg span{padding:6px 16px;border-radius:5px;text-decoration:none;color:var(--ink2)}
.seg a:hover{color:var(--ink);background:rgba(95,212,244,.08)}
.seg span{background:rgba(95,212,244,.16);color:var(--cyan)}
.kpis{display:flex;justify-content:flex-end;gap:26px}
.kpi small{display:block;font:500 10px var(--hud);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.kpi b{font:500 18px var(--mono);font-variant-numeric:tabular-nums}
.kpi b em{font:400 12px var(--mono);color:var(--ink2);font-style:normal}
.kpi.act b{color:var(--amber)}
/* breadcrumb */
#crumb{position:fixed;left:max(20px,env(safe-area-inset-left,0px));top:74px;z-index:4;display:flex;align-items:center;gap:8px;font:500 13px var(--hud);letter-spacing:.06em;color:var(--ink2)}
#crumb button{color:var(--cyan);padding:4px 8px;border:1px solid var(--line2);border-radius:6px}
#crumb button:hover{background:rgba(95,212,244,.1)}
#crumb b{color:var(--ink);font-weight:500}
#note{font:11px var(--mono);color:var(--ink2);border:1px dashed var(--line2);border-radius:4px;padding:2px 8px;margin-left:6px}
/* rail */
#rail{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:78px;bottom:16px;width:var(--rail);z-index:4;background:var(--glass);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;backdrop-filter:blur(8px);overflow:hidden}
.rhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font:500 12px var(--hud);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.rhead .cnt{background:var(--amber);color:#201400;border-radius:10px;padding:1px 9px;font:600 12px var(--mono);letter-spacing:0}
.rhead .cnt.zero{background:transparent;color:var(--green);border:1px solid var(--green)}
#needs{overflow:auto;padding:0 8px 8px;display:grid;gap:4px;align-content:start;flex:1}
.need{display:grid;gap:3px;padding:10px 10px 10px 12px;border-radius:8px;border:1px solid transparent;width:100%}
.need:hover{background:rgba(95,212,244,.06);border-color:var(--line)}
.need.on{border-color:var(--amber);background:rgba(255,178,62,.07)}
.need .top{display:flex;justify-content:space-between;gap:8px;font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.need .top .fc{color:var(--cyan)}
.need strong{font:500 14px var(--body);color:var(--ink);white-space:normal}
.shead{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:11px 16px 8px;font:500 12px var(--hud);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);flex:none}
.shead small{font:10px var(--mono);letter-spacing:.04em;text-transform:none;color:var(--ink3);display:flex;align-items:center;gap:6px}
#stream{list-style:none;margin:0;padding:2px 14px 12px;height:270px;flex:none;overflow:hidden;display:flex;flex-direction:column;gap:7px;font:11.5px/1.42 var(--mono);color:var(--ink2)}
#stream li{display:grid;grid-template-columns:42px 1fr;gap:8px;flex:none}
#stream time{color:var(--ink3)}
#stream b{font-weight:500}
#stream span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#stream li.flag time{color:var(--amber)}
#stream li:first-child span{color:var(--ink)}
#tip{position:fixed;z-index:7;pointer-events:none;background:#09121f;border:1px solid var(--line2);border-radius:6px;padding:5px 9px;font:11px var(--mono);color:var(--ink2);white-space:nowrap;transform:translate(-50%,calc(-100% - 14px))}
#tip b{color:var(--ink);font-weight:500}
#tip[hidden]{display:none}
/* detail */
#detail{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:78px;bottom:16px;width:var(--rail);z-index:6;background:#09121f;border:1px solid var(--line2);border-radius:12px;padding:16px 18px 20px;overflow:auto;display:grid;gap:12px;align-content:start;transform:translateX(calc(100% + 24px));transition:transform .22s ease;visibility:hidden}
#detail.on{transform:none;visibility:visible}
#detail .x{justify-self:end;color:var(--ink2);font:500 11px var(--hud);letter-spacing:.14em;padding:4px 8px;border:1px solid var(--line);border-radius:6px}
#detail .x:hover{color:var(--ink);border-color:var(--line2)}
.eyebrow{font:500 11px var(--hud);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
#detail h2{margin:0;font:500 22px/1.2 var(--hud);text-wrap:balance}
#detail p{margin:0;color:var(--ink2)}
#detail p.lead{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:11px var(--mono);border:1px solid var(--line2);border-radius:4px;padding:2px 7px}
.tag.amber{border-color:var(--amber);color:var(--amber)}.tag.red{border-color:var(--red);color:var(--red)}.tag.green{border-color:var(--green);color:var(--green)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.hist time{font:11px var(--mono);color:var(--ink2);padding-top:2px}
.hist b{display:block;font-weight:500;color:var(--ink)}
.hist span{color:var(--ink2)}
.btn{border:1px solid var(--amber);border-radius:7px;padding:8px 14px;font:600 13px var(--body);justify-self:start;background:var(--amber);color:#201400}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;gap:8px;flex-wrap:wrap}
/* scene labels */
.core{display:grid;justify-items:center;gap:0;text-align:center;pointer-events:none!important}
.core b{font:500 46px/1 var(--mono);color:var(--amber);text-shadow:0 0 24px rgba(255,178,62,.45)}
.core b.zero{color:var(--green);text-shadow:none}
.core small{font:500 11px var(--hud);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.core em{font:500 10px var(--hud);letter-spacing:.3em;color:var(--ink2);font-style:normal;margin-bottom:6px}
.spend{font:11px var(--mono);color:var(--ink2);pointer-events:none!important}
.spend b{color:var(--ink);font-weight:500}
.fac{display:grid;gap:3px;justify-items:center;text-align:center;padding:8px 12px;border-radius:10px;border:1px solid transparent}
.fac:hover{border-color:var(--line2);background:rgba(95,212,244,.07)}
.fac .nm{font:500 16px var(--hud);letter-spacing:.04em;color:var(--ink)}
.fac .st{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.fac .ct{font:12px var(--mono);color:var(--ink2)}
.fac .bd{font:600 11px var(--mono);background:var(--amber);color:#201400;border-radius:10px;padding:1px 9px;margin-top:2px}
.fac.plan .nm{color:var(--ink2)}.fac.plan .st{color:var(--ink3)}
.fac.off .st{color:var(--ink2)}
.stg{display:grid;gap:2px;justify-items:center;text-align:center;padding:4px 6px;border-radius:6px}
.stg:hover{background:rgba(95,212,244,.08)}
.stg .nm{font:500 14px var(--hud);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:5px}
.stg .ag{font:11px var(--mono);color:var(--ink2);display:flex;align-items:center;gap:5px;font-size:11px}
.stg .ag.idle{color:var(--ink3)}
.stg .ag i{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.stg .ag.blocked i{background:var(--amber)}.stg .ag.blocked{color:var(--amber)}
.stg.gate.open .nm{color:var(--amber)}
.stg svg{width:11px;height:11px}
.chips{display:grid;gap:5px;justify-items:center}
.chip{display:flex;align-items:flex-start;gap:7px;font:500 13px/1.25 var(--body);color:var(--ink);background:rgba(10,22,38,.94);border:1px solid var(--line2);border-radius:7px;padding:6px 11px 7px 9px;white-space:nowrap;text-align:left}
.chip span{display:grid;gap:1px}
.chip small{font:400 11px var(--mono);color:var(--ink2)}
.chip i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-top:4px}
.chip:hover{border-color:var(--cyan)}
.chip .sp{flex:none;align-self:center;margin-left:6px;width:46px;height:22px}
.chip.s-waiting{border-color:var(--amber)}.chip.s-waiting i{background:var(--amber)}
.chip.sel{box-shadow:0 0 0 1px var(--cyan)}
.rej{font:500 12px var(--hud);letter-spacing:.1em;text-transform:uppercase;color:var(--red);padding:4px 8px;border-radius:6px;text-align:center}
.rej:hover{background:rgba(255,93,108,.1)}
.rej b{display:block;font:500 16px var(--mono)}
.empty{font:12px var(--mono);color:var(--ink3)}
.dim{opacity:.28}
/* zoomed level: header node, You dock, readout */
.fhead{display:grid;gap:2px}
.fhead .nm{font:500 20px/1.15 var(--hud);letter-spacing:.03em;color:var(--ink)}
.fhead .st{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.fhead.off .st,.fhead.plan .st{color:var(--ink2)}
.fhead .ct{font:12px var(--mono);color:var(--ink2)}
.ydock{display:grid;justify-items:end;gap:0;text-align:right}
.ydock em{font:500 10px var(--hud);letter-spacing:.3em;color:var(--ink2);font-style:normal}
.ydock b{font:500 22px/1.1 var(--mono);color:var(--amber)}
.ydock b.zero{color:var(--green)}
.ydock small{font:500 10px var(--hud);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
#readout{position:fixed;left:max(24px,env(safe-area-inset-left,0px));right:calc(var(--rail) + 48px);bottom:18px;z-index:3;display:grid;grid-template-columns:minmax(0,1.9fr) auto auto minmax(0,1.5fr);gap:32px;align-items:start;padding-top:14px;border-top:1px solid var(--line);opacity:0;visibility:hidden;transition:opacity .25s}
body.zoomed #readout{opacity:1;visibility:visible}
#readout h3{margin:0 0 8px;font:500 10px var(--hud);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.flow{display:flex;gap:4px;align-items:flex-end}
.flow div{display:grid;gap:2px;min-width:0;flex:1}
.flow b{font:500 20px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.flow b.z{color:var(--ink3)}
.flow span{font:10.5px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow i{height:2px;background:var(--line2);border-radius:1px;margin-top:4px}
.flow i.on{background:var(--cyan)}
.gauge{display:flex;align-items:center;gap:12px}
.gauge svg{width:54px;height:54px}
.gauge b{display:block;font:500 18px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.gauge small,.runs small{font:11px var(--mono);color:var(--ink2)}
.runs b{display:block;font:500 20px/1 var(--mono);margin-bottom:4px}
.evs{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.evs li{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:12px;color:var(--ink2)}
.evs time{font:11px var(--mono);color:var(--ink3)}
.evs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* detail extras */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tile small{display:block;font:500 9.5px var(--hud);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.tile b{font:500 16px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.pnl{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.pnl svg{display:block;width:100%;height:64px}
.sp{color:var(--green)}.sp.down{color:var(--amber)}.sp .line{fill:none;stroke:currentColor;stroke-width:1.5;vector-effect:non-scaling-stroke}.sp .area{fill:currentColor;opacity:.12}.sp .zero{stroke:currentColor;opacity:.3;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}.sp.mini .area,.sp.mini .zero{display:none}
.pnl .cap{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink2);margin-bottom:4px}
.steps{display:flex;gap:3px}
.steps span{flex:1;display:grid;gap:5px;font:10px var(--mono);color:var(--ink3);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps span::before{content:"";height:3px;border-radius:2px;background:var(--line2)}
.steps span.past::before{background:var(--cyan)}
.steps span.cur{color:var(--ink)}.steps span.cur::before{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.steps span.cur.wait{color:var(--amber)}.steps span.cur.wait::before{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.dl dt{font:500 10px var(--hud);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding-top:3px}
.dl dd{margin:0;color:var(--ink)}
.killbox{border:1px solid var(--red);border-radius:8px;padding:10px 12px;color:var(--ink)}
/* phone */
@media (max-width:760px){
  header{grid-template-columns:1fr auto;row-gap:10px;padding-top:12px}
  .kpis{grid-column:1/-1;justify-content:space-between;gap:10px}
  .kpi b{font-size:15px}.kpi small{font-size:9px;letter-spacing:.1em}
  .brand{font-size:13px;letter-spacing:.16em}
  #crumb{top:118px;flex-wrap:wrap;right:16px}
  #rail{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:14px 14px 0 0;border-width:1px 0 0;max-height:60%;padding-bottom:env(safe-area-inset-bottom,0px)}
  #rail.closed #needs,#rail.closed .shead,#rail.closed #power{display:none}
  #rail.closed #stream{height:27px;padding-bottom:8px}
  #rail.closed #stream span{-webkit-line-clamp:1}
  #stream{height:132px}
  #tip{display:none}
  .rhead{cursor:pointer}
  #detail{left:0;right:0;top:auto;bottom:0;width:auto;max-height:72%;border-radius:14px 14px 0 0;transform:translateY(105%)}
  .fac{padding:4px 6px}.fac .nm{font-size:13px}.fac .ct{display:none}
  .core b{font-size:34px}
  .chip{max-width:190px;white-space:normal}
  .chip small{display:none}
  #readout{display:none}
  .stg{justify-items:end;text-align:right}
  .chips{justify-items:start}
}
@media (prefers-reduced-motion:reduce){#detail,.lv-all,.lv-fac{transition:none}}
#power{display:grid;gap:2px;padding:4px 14px 10px}
#power div{display:flex;align-items:center;justify-content:space-between;font:13px var(--body);color:var(--ink)}
.sw{display:flex;align-items:center;gap:7px;font:500 11px var(--mono);color:var(--ink3);background:none;border:0;padding:5px 4px;cursor:pointer}
.sw i{width:26px;height:14px;border-radius:999px;background:rgba(120,190,230,.22);position:relative}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink2);transition:transform .15s}
.sw[aria-checked="true"]{color:var(--green)}
.sw[aria-checked="true"] i{background:rgba(111,224,176,.35)}
.sw[aria-checked="true"] i::after{transform:translateX(12px);background:var(--green)}
.clear{margin:6px 16px 12px;color:var(--ink2);font-size:13px}
.dl dd small{display:block;font:11px var(--mono);color:var(--ink3);overflow-wrap:anywhere;margin-top:2px}
.load-error{position:fixed;inset:0 0 auto 0;z-index:99;padding:12px 16px;background:#3a1218;color:#ffb3ba;font:14px var(--body)}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="labels"></div>

<header>
  <div><div class="brand"><i></i>Factories · Live</div><div class="asof" id="asof"></div></div>
  <nav class="seg" aria-label="View"><a href="board.html">Board</a><span aria-current="page">Live</span></nav>
  <div class="kpis" id="kpis"></div>
</header>

<div id="crumb" hidden></div>
<div id="readout" aria-label="Factory readout"></div>

<aside id="rail" aria-label="Needs you">
  <div class="rhead" id="rhead"><span>Needs you</span><span class="cnt" id="rcnt"></span></div>
  <div id="needs"></div>
  <div class="shead"><span>Factories</span><small>off stops every run</small></div>
  <div id="power"></div>
  <div class="shead"><span>Event stream</span><small>latest runs</small></div>
  <ul id="stream" aria-label="Event stream"></ul>
</aside>

<div id="tip" hidden></div>
<section id="detail" aria-live="polite" aria-hidden="true"></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
<script type="module">
const D = await loadData().catch(err => { showError(err); throw err; });
const FS = D.factories;
const $ = id => document.getElementById(id);
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const C = {cyan:"95,212,244", amber:"255,178,62", red:"255,93,108", green:"111,224,176", ink:"217,232,244"};
const LOCK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.2" y="5.4" width="7.6" height="5.2" rx="1"/><path d="M4 5.4V3.8a2 2 0 0 1 4 0v1.6"/></svg>';

// fixed positions on the orbit: live work sits in front, blueprints behind
const R = 300, S = 100, OR = 104, TAU = Math.PI * 2;
const BUILT = FS.filter(f => !f.planned), PLANNED = FS.filter(f => f.planned);
BUILT.forEach((f, k) => { f.x = BUILT.length > 1 ? (k / (BUILT.length - 1) - .5) * 472 : -236; f.z = 185; });
PLANNED.forEach((f, k) => { const a = (270 + (k - (PLANNED.length - 1) / 2) * Math.min(65, 180 / PLANNED.length)) * Math.PI / 180; f.x = R * Math.cos(a); f.z = R * Math.sin(a); });
// each built factory carries its stage chain on a small tilted orbit; the gap in the orbit faces You
FS.forEach(f => {
  if (f.planned) return;
  const n = f.stages.length, back = Math.atan2(-f.z, -f.x), gap = .5, step = (TAU - 2 * gap) / n;
  f.orb = a => { const z = Math.sin(a); return [f.x + OR * Math.cos(a), 13 * (1 - z), f.z + OR * z]; };
  f.sa = f.stages.map((s, i) => back - gap - i * step);

    <div class="kpi"><small>Spend</small><b>$${spent.toFixed(2)}<em> / $${budget}</em></b></div>
    <div class="kpi"><small>Items alive</small><b>${al}</b></div>`;
  $("rcnt").textContent = open; $("rcnt").className = "cnt" + (open ? "" : " zero");
  $("needs").innerHTML = FS.flatMap(f => f.approvals.map(a => `<button class="need ${st.hl === a.id ? "on" : ""}" type="button" data-f="${esc(f.id)}" data-a="${esc(a.id)}">
      <span class="top"><span class="fc">${esc(f.short)}</span><span>${esc(a.id)}</span></span>
      <strong>${esc(a.title)}</strong></button>`)).join("") || `<p class="clear">Nothing is waiting on you.</p>`;
  $("needs").querySelectorAll(".need").forEach(b => b.onclick = () => openApproval(b.dataset.f, b.dataset.a));
  $("power").innerHTML = FS.map(f => `<div><span>${esc(f.short)}</span>${powerSwitch(f)}</div>`).join("");
  const sc = st.fac && st.target ? st.fac.id : "*"; if (sc !== st.scope) { st.scope = sc; streamReset(); }
  document.body.classList.toggle("zoomed", !!(st.fac && st.target));
  if (st.fac && st.target) readout(st.fac);
  const c = $("crumb");
  if (st.fac && st.target) {
    c.hidden = false;
    c.innerHTML = `<button type="button" id="back">← All factories</button><span>›</span><b>${esc(st.fac.name)}</b>${st.fac.on ? "" : `<span id="note">Off. No run starts while ${esc(stopNote(st.fac))} exists.</span>`}`;
    $("back").onclick = zoomOut;
  } else c.hidden = true;
}

function readout(f) {
  const sp = f.spend, pct = sp.monthBudget ? Math.min(1, sp.month / sp.monthBudget) : 0, c = 2 * Math.PI * 22;
  const evs = f.events.slice(0, 3);
  $("readout").innerHTML = `
    <div><h3>${f.planned ? "Planned stages" : "Reached each stage"}</h3><div class="flow">${f.stages.map(sg => `<div><b class="${sg.reached ? "" : "z"}">${f.planned ? "–" : sg.reached}</b><span>${esc(shortName(sg))}</span><i class="${sg.reached ? "on" : ""}"></i></div>`).join("")}</div></div>
    <div><h3>Spend</h3><div class="gauge"><svg viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="22" fill="none" stroke="rgba(95,212,244,.16)" stroke-width="4"/><circle cx="27" cy="27" r="22" fill="none" stroke="#5fd4f4" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c * Math.max(pct, f.planned ? 0 : .02)).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 27 27)"/></svg><div><b>$${sp.month.toFixed(2)}</b><small>${sp.monthBudget ? "of $" + sp.monthBudget + " this month" : "no budget set"}</small></div></div></div>
    <div class="runs"><h3>Runs</h3><b>${sp.runs}</b><small>${f.planned ? "not built" : "this month"}</small></div>
    <div><h3>Latest</h3>${evs.length ? `<ul class="evs">${evs.map(ev => `<li><time>${esc(ev.t)}</time><span>${esc(ev.text)}</span></li>`).join("")}</ul>` : `<div class="empty">No runs yet.</div>`}</div>`;
}

// ---------- detail ----------
function show(html) {
  const d = $("detail"); d.innerHTML = `<button class="x" type="button" id="dx">CLOSE</button>` + html;
  d.classList.add("on"); d.setAttribute("aria-hidden", "false"); $("dx").onclick = closeDetail;
}
function closeDetail() { const d = $("detail"); d.classList.remove("on"); d.setAttribute("aria-hidden", "true"); if (st.hl || st.sel) { st.hl = null; st.sel = null; buildLabels(); hud(); } }
const histHtml = h => h ? `<ul class="hist">${h.map(x => `<li><time>${x[0]}</time><div><b>${esc(x[1])}</b><span>${esc(x[2])}</span></div></li>`).join("")}</ul>` : "";
function openItem(id) {
  const f = st.fac, it = f.items.find(i => i.id === id), ci = f.stages.findIndex(s => s.id === it.stage);
  st.sel = id; st.hl = null; buildLabels(); hud();
  const tiles = [...Object.entries(it.facts).map(([k, v]) => [k.replace(/_/g, " "), v]), ["spent", "$" + it.spend.toFixed(2)]];
  show(`<div class="eyebrow">${esc(f.short)} · ${esc(ci < 0 ? "no stage" : f.stages[ci].name)}</div><h2>${esc(it.name)}</h2>
    <div class="tags">${[it.platform, it.category].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}<span class="tag ${it.state === "waiting" ? "amber" : it.state === "killed" ? "red" : "green"}">${it.state === "waiting" ? "waiting on you" : it.state}</span></div>
    ${it.pnl ? `<div class="pnl"><div class="cap"><span>Paper result, % since start</span><span style="color:var(--ink)">${it.pnl[it.pnl.length - 1] > 0 ? "+" : ""}${it.pnl[it.pnl.length - 1].toFixed(1)}%</span></div>${sparkline(it.pnl, 280, 64)}</div>` : ""}
    <p class="lead">${esc(it.summary)}</p>
    ${it.killed ? `<div class="killbox"><b style="font-weight:500">Rejected.</b> ${esc(it.killed)}</div>` : ""}
    <div class="steps">${f.stages.map((q, i) => `<span class="${i < ci ? "past" : i === ci ? "cur" + (it.state === "waiting" ? " wait" : "") : ""}">${esc(shortName(q))}</span>`).join("")}</div>
    <div class="tiles">${tiles.map(([l, v]) => `<div class="tile"><small>${esc(l)}</small><b>${esc(v)}</b></div>`).join("")}</div>
    ${it.evidence.length ? `<dl class="dl"><dt>Evidence</dt>${it.evidence.map(e => `<dd>${esc(e.claim)}<small>${esc(e.source)}</small></dd>`).join("")}</dl>` : ""}
    ${it.blockedBy ? `<div class="row"><button class="btn" type="button" id="goAp">Review ${esc(it.blockedBy)}</button><span style="align-self:center;font-size:12px;color:var(--ink2)">blocks this item</span></div>` : ""}
    ${histHtml(it.history)}`);
  const g = $("goAp"); if (g) g.onclick = () => openApproval(f.id, it.blockedBy);
}
function openStage(id) {
  const f = st.fac, sg = f.stages.find(s => s.id === id), its = f.items.filter(i => i.stage === id);
  st.sel = null; st.hl = null; st.xr = {sid: id, t0: st.tt}; buildLabels(); hud();
  show(`<div class="eyebrow">${esc(f.short)} · stage</div><h2>${esc(sg.name)}</h2>
    ${sg.gate ? `<div class="tags"><span class="tag ${stageOpen(f, id) ? "amber" : ""}">Gate · ${esc(sg.gate)}</span></div>` : ""}
    <p>${sg.runs.length ? "Worked by " + esc(sg.runs.join(", ")) + "." : "No skill runs this stage."} ${sg.reached} reached it.</p>
    ${sg.last ? `<p class="lead">Last run ${esc(sg.last.t)}: ${esc(sg.last.text)}</p>` : `<p>No runs yet.</p>`}
    <ul class="hist">${its.map(i => `<li><time>${i.state === "killed" ? "rejected" : "here"}</time><div><b>${esc(i.name)}</b><span>${esc(i.killed || i.summary)}</span></div></li>`).join("") || `<li><time>—</time><div><span>Nothing is at this stage.</span></div></li>`}</ul>`);
}
function openRejects() {
  const f = st.fac, ks = killed(f); st.sel = null; st.hl = null; buildLabels(); hud();
  show(`<div class="eyebrow">${esc(f.short)} · rejected</div><h2>${ks.length} rejected</h2><p>Each one records where it stopped and why.</p>
    <ul class="hist">${ks.map(i => `<li><time>${esc((f.stages.find(s => s.id === i.stage) || {name: "–"}).name)}</time><div><b>${esc(i.name)}</b><span>${esc(i.killed)}</span></div></li>`).join("")}</ul>`);
}
function openApproval(fid, aid) {
  const f = FS.find(x => x.id === fid), a = f.approvals.find(x => x.id === aid);
  st.hl = aid; st.sel = null; zoomTo(fid, true);
  const its = a.items.map(id => f.items.find(i => i.id === id));
  show(`<div class="eyebrow">Needs you · ${esc(a.id)}</div><h2>${esc(a.title)}</h2>
    <div class="tags"><span class="tag amber">waiting on you</span><span class="tag">${esc(f.name)}</span>${a.expires ? `<span class="tag">expires ${esc(a.expires)}</span>` : ""}</div>
    <p class="lead">${esc(a.detail) || "See the packet."}</p>
    ${its.length ? `<ul class="hist">${its.map(i => `<li><time>covers</time><div><b>${esc(i.name)}</b><span>${esc(i.summary)}</span></div></li>`).join("")}</ul>` : ""}
    <dl class="dl"><dt>To decide</dt><dd>Read the packet, then move it to escalations/approved/ or escalations/rejected/. The next run acts on it.<small>${esc(a.file)}</small></dd></dl>`);
}

// ---------- navigation ----------
function zoomTo(fid, keep) {
  const f = FS.find(x => x.id === fid);
  if (st.fac !== f && st.t > 0) st.t = 0;
  st.fac = f; st.target = 1; if (!keep) { st.hl = null; st.sel = null; $("detail").classList.remove("on"); }
  if (RM) st.t = 1;
  if (phone) $("rail").classList.add("closed");
  history.replaceState(null, "", "#" + f.id);
  buildLabels(); hud(); kick();
}
function zoomOut() { history.replaceState(null, "", location.pathname); st.target = 0; st.hl = null; st.sel = null; $("detail").classList.remove("on"); if (RM) { st.t = 0; st.fac = null; buildLabels(); } hud(); kick(); }

let raf = 0, last = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  if (st.t !== st.target) { st.t += Math.sign(st.target - st.t) * dt / .55; if (Math.abs(st.t - st.target) < .02 || (st.target ? st.t > 1 : st.t < 0)) { st.t = st.target; if (!st.target) { st.fac = null; buildLabels(); } else st.xr = {sid: "*", t0: st.tt}; } }
  if (!RM) {
    st.spin += dt * .012; st.tt += dt; st.px += (st.mx - st.px) * .05; st.py += (st.my - st.py) * .05;
  }
  draw(); placeLabels();
  raf = (!RM || st.t !== st.target) ? requestAnimationFrame(frame) : 0;
}
function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }

addEventListener("resize", () => { measure(); buildLabels(); kick(); });
addEventListener("mousemove", ev => { st.mx = ev.clientX / W - .5; st.my = ev.clientY / H - .5; });
addEventListener("keydown", ev => { if (ev.key === "Escape") { if ($("detail").classList.contains("on")) closeDetail(); else if (st.target) zoomOut(); } });
const hitAt = ev => { let best = null, bd = 1e9; for (const o of HIT) { const d = Math.hypot(o.x - ev.clientX, o.y - ev.clientY), w = o.it ? 200 : o.s || o.bin ? 60 : 0; if (d < o.r && d - w < bd) { bd = d - w; best = o; } } return best; };
cv.addEventListener("click", ev => {
  const o = hitAt(ev); if (!o) return;
  if (!st.target) zoomTo(o.f.id); else if (o.it) openItem(o.it.id); else if (o.s) openStage(o.s.id); else if (o.bin) openRejects();
});
cv.addEventListener("mousemove", ev => {
  const o = hitAt(ev), tip = $("tip"); cv.style.cursor = o ? "pointer" : "";
  if (o && o.it) { tip.innerHTML = `<b>${esc(o.it.name)}</b> · ${esc(chipFact(o.it))}`; tip.style.left = o.x + "px"; tip.style.top = (o.y - o.r) + "px"; tip.hidden = false; }
  else if (o && (o.s || o.bin)) {
    const n = o.s ? alive(o.f).filter(it => it.stage === o.s.id).length : killed(o.f).length;
    tip.innerHTML = o.s ? `<b>${esc(o.s.name)}</b> · ${STATUS_TXT[stStatus(o.f, o.s).k]} · ${n} here${o.s.gate ? " · gate" : ""}` : `<b>Rejected</b> · ${n} ideas stopped`;
    tip.style.left = o.x + "px"; tip.style.top = (o.y - o.r) + "px"; tip.hidden = false;
  } else tip.hidden = true;
});
cv.addEventListener("mouseleave", () => { $("tip").hidden = true; });
$("rhead").onclick = () => { if (phone) $("rail").classList.toggle("closed"); };

// a switch or new runs change what every label and machine shows, so start again from the new files
onPower(() => FS, () => location.reload());
watch(() => D, () => location.reload());
measure(); if (phone) $("rail").classList.add("closed");
hud(); measure(); buildLabels(); draw(); placeLabels(); kick();
if (location.hash.length > 1 && FS.some(f => f.id === location.hash.slice(1))) { st.t = RM ? 1 : .999; zoomTo(location.hash.slice(1)); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); buildLabels(); kick(); });
</script>
</body>
</html>
