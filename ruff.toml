# Lint for real faults only: undefined names, unused imports and variables, likely bugs.
# Style and layout are left alone, so the linter never causes churn. See REVIEW.md.
extend-exclude = [
    "factories/c-trading/design",       # one-off trials, kept as a record
    "factories/c-trading/strategies",   # trial history is tied to each file's exact text
]

[lint]
select = ["F", "E9", "B"]
ignore = ["B905"]   # zip() lengths are checked where they matter
