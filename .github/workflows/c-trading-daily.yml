name: c-trading-daily
# The judge's daily job for the trading factory (factories/c-trading/FACTORY_SPEC.md sections 4.4 to 4.6).
#   1. Final exam for every strategy waiting at `optimised`.
#   2. Paper stage and health watch for every strategy that passed, and for near misses on watch.
# Started by hand for now (Actions tab, "Run workflow"): no factory runs on a timer until Tirth says so.
# To make it daily again, add under `on:`   schedule: [{cron: "23 5 * * *"}]   (bars are published about
# three hours after midnight UTC). A schedule always runs the copy of this file on main, with the engine from main.
# From the factory-state branch come each strategy's strategy.py and params.yaml and the run state
# (items, trial log, gate files).
# Two jobs. `judge` runs strategy code and can only read the repository. `record` holds the write
# permission, never runs strategy code, and commits only the result files the judge handed over.
# Prices after the development cutoff are downloaded here and nowhere else.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: c-trading-daily
env:
  FACTORY: factories/c-trading
  STATE: state-branch/factories/c-trading
jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: factory-state
          path: state-branch
          persist-credentials: false     # strategy code runs in this job and must not find a token
      - name: Find strategies waiting for the exam or on paper
        id: find
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re
          state = pathlib.Path(os.environ["STATE"])
          exam, paper = [], []
          for p in sorted((state / "state" / "items").glob("*.json")):
              if not re.fullmatch(r"[a-z0-9-]+", p.stem):
                  continue
              try:
                  stage = json.loads(p.read_text()).get("stage")
              except ValueError:
                  continue
              sat = (state / "exam" / f"{p.stem}.json").exists()
              if stage == "optimised" and not sat:
                  exam.append(p.stem)
              elif (stage in ("paper", "confirmed", "paused", "awaiting_human") and sat) or stage == "watch":
                  paper.append(p.stem)
          import subprocess
          print("sha=" + subprocess.run(["git", "-C", "state-branch", "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout.strip())
          print("exam=" + " ".join(exam))
          print("all=" + " ".join(exam + paper))
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.find.outputs.all != ''
        with:
          python-version: "3.13"
      - name: Exam, paper stage and health watch
        if: steps.find.outputs.all != ''
        env:
          EXAM: ${{ steps.find.outputs.exam }}
          ALL: ${{ steps.find.outputs.all }}
          FACTORY_EXAM: "1"
        run: |
          pip install -q -r "$FACTORY/requirements.txt"
          export FACTORY_STATE_DIR="$PWD/$STATE/state"
          for id in $ALL; do
            mkdir -p "$FACTORY/strategies/$id"
            cp "$STATE/strategies/$id/strategy.py" "$STATE/strategies/$id/params.yaml" "$FACTORY/strategies/$id/"
          done
          cd "$FACTORY"
          python data/fetch_binance.py --window dev --verify > /dev/null
          python data/fetch_binance.py --window exam > /dev/null
          for id in $EXAM; do
            python -m engine.exam "$id" 2> /dev/null || true
          done
          python -m engine.paper 2> /dev/null
      - name: Hand over what the judge wrote
        if: always() && steps.find.outputs.all != ''
        run: |
          mkdir -p out/state
          for d in exam paper health state/items state/gate state/trials; do
            [ -d "$STATE/$d" ] && cp -r "$STATE/$d" "out/$d"
          done
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.find.outputs.all != ''
        with:
          name: judge-results
          path: out
          retention-days: 3
    outputs:
      ran: ${{ steps.find.outputs.all != '' }}
      sha: ${{ steps.find.outputs.sha }}
  record:
    needs: judge
    if: always() && needs.judge.outputs.ran == 'true' && needs.judge.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Start from the exact state the judge read, so that anything pushed to factory-state while it ran
      # is kept by the rebase below and not overwritten by the judge's older copy.
      # This job pushes, so it keeps the token. It runs no strategy code and uploads no artifact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.judge.outputs.sha }}
          fetch-depth: 0  # zizmor: ignore[artipacked] (on its own line, so Dependabot's version bumps keep it)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: judge-results
          path: factories/c-trading
      - name: Record the results
        run: |
          git config user.name "trading factory judge"
          git config user.email "actions@users.noreply.github.com"
          for d in exam paper health state/items state/gate state/trials; do
            [ -e "factories/c-trading/$d" ] && git add -A "factories/c-trading/$d"
          done
          git diff --cached --quiet && exit 0
          git commit -q -m "Exam and paper results"
          git pull -q --rebase origin factory-state
          git push -q origin HEAD:factory-state
