name: c-trading
on:
  pull_request:
    paths: ["factories/c-trading/**", ".github/workflows/c-trading.yml"]
  push:
    branches: [main]
    paths: ["factories/c-trading/**", ".github/workflows/c-trading.yml"]
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r factories/c-trading/requirements.txt pytest-cov diff-cover
      - run: python -m pytest factories/c-trading -q --cov --cov-config=factories/c-trading/.coveragerc --cov-report=xml
      # REVIEW.md, "What CI enforces". The test-change rule runs in the checks workflow.
      - name: Changed lines are covered by tests
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch "$BASE" --fail-under 80
