name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --cov --cov-report=xml
      # REVIEW.md, "What CI enforces".
      - name: Lint finds no faults
        run: ruff check .
      - name: Workflows have no known security faults
        run: zizmor --offline .github
      - name: Changed lines are covered by tests
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch "$BASE" --fail-under 80
  # The base branch's copy of the gate, in its own job, so no code from the pull request runs before it:
  # not its tests, not its requirements. -I keeps a module the pull request adds under tools/ from being
  # imported in place of the standard library.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install coverage==7.17.3
      - name: Code changes come with tests
        run: |
          git show "$BASE:tools/pr_gate.py" > tools/pr_gate.py
          python -I tools/pr_gate.py --base "$BASE"
