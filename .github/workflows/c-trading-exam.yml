name: c-trading-exam
# The final exam of the trading factory (factories/c-trading/FACTORY_SPEC.md section 4.4).
# A schedule always runs the copy of this file on main, with the engine from main.
# Only strategy.py and params.yaml are taken from the factory-state branch.
# The held-back data is downloaded here and nowhere else, and only pass or fail is published.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
permissions:
  contents: write
concurrency: c-trading-exam
env:
  FACTORY: factories/c-trading
  STATE: state-branch/factories/c-trading
jobs:
  exam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: factory-state
          path: state-branch
      - name: Find strategies waiting for the exam
        id: find
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          state = pathlib.Path(os.environ["STATE"])
          ids = [p.stem for p in sorted((state / "state" / "items").glob("*.json"))
                 if json.loads(p.read_text()).get("stage") == "optimised"
                 and not (state / "exam" / f"{p.stem}.json").exists()]
          print("ids=" + " ".join(ids))
          PY
      - uses: actions/setup-python@v5
        if: steps.find.outputs.ids != ''
        with:
          python-version: "3.13"
      - name: Sit the exam
        if: steps.find.outputs.ids != ''
        env:
          IDS: ${{ steps.find.outputs.ids }}
        run: |
          pip install -q -r "$FACTORY/requirements.txt"
          export FACTORY_STATE_DIR="$PWD/$STATE/state"
          for id in $IDS; do
            case "$id" in *[!a-z0-9-]*) echo "skipping bad id"; continue;; esac
            mkdir -p "$FACTORY/strategies/$id"
            cp "$STATE/strategies/$id/strategy.py" "$STATE/strategies/$id/params.yaml" "$FACTORY/strategies/$id/"
          done
          cd "$FACTORY"
          python data/fetch_binance.py --window dev --verify > /dev/null
          FACTORY_EXAM=1 python data/fetch_binance.py --window exam > /dev/null
          for id in $IDS; do
            FACTORY_EXAM=1 python -m engine.exam "$id" 2> /dev/null || true
          done
      - name: Record the results
        if: steps.find.outputs.ids != ''
        working-directory: state-branch
        run: |
          git config user.name "exam job"
          git config user.email "actions@users.noreply.github.com"
          git add -A factories/c-trading
          git diff --cached --quiet && exit 0
          git commit -q -m "Final exam results"
          git pull -q --rebase
          git push -q
